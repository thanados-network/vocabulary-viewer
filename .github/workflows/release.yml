name: Release & Version Bump

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]') && !startsWith(github.event.head_commit.message, 'chore(release):')"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump version and push tag
        uses: phips28/gh-action-bump-version@v11.0.8
        with:
          tag-prefix: 'v'
          major-wording: 'BREAKING CHANGE,BREAKING-CHANGE,feat!,fix!'
          minor-wording: 'feat,feature'
          patch-wording: 'fix,perf,refactor,docs,style,chore'
          commit-message: 'chore(release): bump version to {{version}} [skip ci]'
          target-branch: 'main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
